{{- if eq (include "ldap-sync.pvcGroupEnabled" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ldap-sync.fullname" . }}-pvc-group
  labels:
    {{- include "ldap-sync.labels" . | nindent 4 }}
rules:
  # plugin_pvc.go lists (by label selector) then creates; it never gets a PVC
  # by name, so `get` is dropped.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ldap-sync.fullname" . }}-pvc-group
  labels:
    {{- include "ldap-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ldap-sync.fullname" . }}-pvc-group
subjects:
  - kind: ServiceAccount
    name: {{ include "ldap-sync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if eq (include "ldap-sync.postgresUserEnabled" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ldap-sync.fullname" . }}-postgres-user
  labels:
    {{- include "ldap-sync.labels" . | nindent 4 }}
rules:
  # plugin_postgres.go gets a secret by name (computed from NamePrefix+user),
  # then creates or updates it; it never lists secrets, so `list` is dropped.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ldap-sync.fullname" . }}-postgres-user
  labels:
    {{- include "ldap-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ldap-sync.fullname" . }}-postgres-user
subjects:
  - kind: ServiceAccount
    name: {{ include "ldap-sync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
